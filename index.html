<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dom Ceramiki Zatorze — społeczna pracownia garnarska</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --clay:    #C96B3A;
    --clay-lt: #F0DAC9;
    --clay-bg: #FBF3EC;
    --moss:    #4A6741;
    --moss-lt: #D6E6D1;
    --cream:   #FAF6F0;
    --ink:     #2A2118;
    --muted:   #7A6A5A;
    --border:  #E2D4C4;
    --white:   #FFFFFF;
    --radius:  12px;
    --radius-sm: 6px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink);
    background: var(--cream);
  }

  h1, h2, h3 { font-family: 'Lora', serif; font-weight: 600; line-height: 1.3; color: var(--ink); }
  h1 { font-size: clamp(2rem, 5vw, 3.2rem); }
  h2 { font-size: clamp(1.5rem, 3vw, 2rem); margin-bottom: 0.5rem; }
  h3 { font-size: 1.15rem; margin-bottom: 0.4rem; }
  p { color: var(--muted); }

  a { color: var(--clay); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .container { max-width: 1080px; margin: 0 auto; padding: 0 1.5rem; }

  /* ─── NAV ─── */
  nav {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-inner {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }
  .nav-logo {
    font-family: 'Lora', serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--clay);
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .nav-logo span.dot {
    width: 28px;
    height: 28px;
    background: var(--clay);
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.15s;
  }
  .nav-links a:hover { color: var(--clay); }
  .nav-cta {
    background: var(--clay);
    color: var(--white) !important;
    padding: 8px 20px;
    border-radius: 100px;
    font-size: 0.85rem;
    font-weight: 700;
    transition: background 0.15s;
  }
  .nav-cta:hover { background: #a8562d; text-decoration: none !important; }

  /* ─── HERO ─── */
  .hero {
    background: var(--clay-bg);
    border-bottom: 1px solid var(--border);
    padding: 5rem 1.5rem 4rem;
  }
  .hero-inner {
    max-width: 1080px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
  }
  .hero-eyebrow {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--clay);
    background: var(--clay-lt);
    padding: 4px 14px;
    border-radius: 100px;
    margin-bottom: 1.2rem;
  }
  .hero h1 { margin-bottom: 1rem; }
  .hero h1 em { font-style: italic; color: var(--clay); }
  .hero-lead {
    font-size: 1.05rem;
    color: var(--muted);
    margin-bottom: 2rem;
    max-width: 44ch;
  }
  .hero-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-primary {
    background: var(--clay);
    color: var(--white);
    padding: 12px 28px;
    border-radius: 100px;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    transition: background 0.15s;
    border: none;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
  }
  .btn-primary:hover { background: #a8562d; text-decoration: none; }
  .btn-outline {
    background: transparent;
    color: var(--clay);
    padding: 12px 28px;
    border-radius: 100px;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    border: 2px solid var(--clay);
    transition: all 0.15s;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
  }
  .btn-outline:hover { background: var(--clay-lt); text-decoration: none; }

  .hero-visual {
    border-radius: var(--radius);
    aspect-ratio: 4/3;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .hero-visual img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ─── WORKSHOPS STRIP ─── */
  .strip {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
  }
  .strip-inner {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    align-items: stretch;
    gap: 0;
    overflow: hidden;
  }
  .strip-label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--white);
    background: var(--clay);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .strip-events {
    display: flex;
    align-items: stretch;
    gap: 0;
    flex: 1;
    overflow-x: auto;
  }
  .strip-event {
    padding: 14px 24px;
    border-left: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .strip-event-date {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--clay);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .strip-event-name {
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--ink);
  }
  .strip-event-spots {
    font-size: 0.75rem;
    color: var(--white);
    background: var(--moss);
    padding: 2px 10px;
    border-radius: 100px;
    font-weight: 700;
  }
  .strip-event-spots.few { background: #C96B3A; }
  .strip-event-spots.none { background: #7a6a5a; }

  /* ─── SECTION ─── */
  section { padding: 5rem 1.5rem; }
  .section-tag {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--clay);
    margin-bottom: 0.6rem;
    display: block;
  }

  /* ─── WORKSHOPS ─── */
  #warsztaty { background: var(--cream); }
  .workshops-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.25rem;
    margin-top: 2.5rem;
  }
  .workshop-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .workshop-card:hover { border-color: var(--clay); }
  .wc-header {
    background: var(--clay-bg);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .wc-date { font-size: 0.78rem; font-weight: 700; color: var(--clay); text-transform: uppercase; letter-spacing: 0.05em; }
  .wc-time { font-size: 0.8rem; color: var(--muted); }
  .wc-body { padding: 1.25rem; }
  .wc-title { font-family: 'Lora', serif; font-size: 1.05rem; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .wc-who { font-size: 0.82rem; color: var(--muted); margin-bottom: 1rem; }
  .wc-footer { display: flex; align-items: center; justify-content: space-between; }
  .wc-spots { font-size: 0.8rem; font-weight: 700; }
  .wc-spots.ok { color: var(--moss); }
  .wc-spots.few { color: var(--clay); }
  .wc-spots.none { color: var(--muted); }
  .wc-btn {
    font-size: 0.82rem;
    font-weight: 700;
    background: var(--clay);
    color: var(--white);
    border: none;
    padding: 7px 18px;
    border-radius: 100px;
    cursor: pointer;
    text-decoration: none;
    font-family: 'Nunito', sans-serif;
    transition: background 0.15s;
  }
  .wc-btn:hover { background: #a8562d; }
  .wc-btn.disabled {
    background: #c2b5a8;
    color: #ffffff;
    cursor: not-allowed;
  }
  .wc-btn.disabled:hover { background: #c2b5a8; }

  /* ─── FORM ─── */
  #zapis { background: var(--clay-bg); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .form-wrap {
    max-width: 560px;
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 2rem; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 0.82rem; font-weight: 700; color: var(--ink); }
  input, select, textarea {
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    width: 100%;
    transition: border-color 0.15s;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--clay); }
  textarea { resize: vertical; min-height: 90px; }
  .form-note { font-size: 0.78rem; color: var(--muted); margin-top: 0.75rem; font-style: italic; }
  .form-submit { margin-top: 1.25rem; }

  /* ─── DOŁĄCZ ─── */
  #dolacz { background: var(--white); }
  .paths-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.25rem;
    margin-top: 2.5rem;
  }
  .path-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    background: var(--cream);
  }
  .path-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--clay-lt);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1rem;
    color: var(--clay);
    font-size: 1.3rem;
  }
  .path-card h3 { color: var(--ink); margin-bottom: 6px; }
  .path-card p { font-size: 0.88rem; }

  /* ─── O NAS ─── */
  #onas { background: var(--clay-bg); border-top: 1px solid var(--border); }
